<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primary-grad)" stroke-width="4" opacity="0.3" stroke-dasharray="12 12" />

  <!-- Central AI Neural / Smart Spark Geometry -->
  <g filter="url(#shadow)">
    <!-- Central Hexagonal Energy Core -->
    <path d="M256 120 L350 174 L350 282 L256 336 L162 282 L162 174 Z" fill="url(#primary-grad)" opacity="0.95" />
    
    <!-- Inner Core Inscription -->
    <path d="M256 150 L324 189 L324 267 L256 306 L188 267 L188 189 Z" fill="#0F172A" opacity="0.9" />

    <!-- Tamil Symbol / AI Brain Spark Nodes -->
    <!-- Stylized "அ" (A - Knowledge root in Tamil) fused with Neural Spark -->
    <path d="M225 210 C215 190 235 175 256 175 C280 175 295 190 295 215 C295 240 270 255 245 255 L285 295 M245 255 L300 255" 
          stroke="url(#glow-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Dynamic Orbiting Sparkles -->
    <circle cx="256" cy="120" r="10" fill="#38BDF8" />
    <circle cx="350" cy="174" r="9" fill="#EC4899" />
    <circle cx="350" cy="282" r="9" fill="#A855F7" />
    <circle cx="256" cy="336" r="10" fill="#6366F1" />
    <circle cx="162" cy="282" r="9" fill="#38BDF8" />
    <circle cx="162" cy="174" r="9" fill="#F43F5E" />

    <!-- Center Pulse Point -->
    <circle cx="256" cy="256" r="6" fill="#F8FAFC" />
  </g>

  <!-- Title Badge / Sub-inscription -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#F1F5F9" letter-spacing="3">SMART AI</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Noto Sans Tamil', system-ui, sans-serif" font-weight="600" font-size="22" fill="#38BDF8" letter-spacing="1">தமிழ் உதவியாளர்</text>
</svg>
